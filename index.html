<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Downloading fun games</title>
  <style>
    /* Basic page styles (you can move to style.css if desired) */
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; padding: 24px; background:#f7f7fb; color:#111 }
    header h1 { margin:0 0 8px 0 }
    nav { color:#374151; margin-bottom:16px }
    .special { background:#fff3cd; padding:12px; border-radius:8px; margin-bottom:12px; border:1px solid #ffeeba }
    a { color:#2563eb; text-decoration:none }
    button[type="button"] { margin-top:6px; padding:10px 14px; border-radius:8px; border:none; background:#111827; color:#fff; cursor:pointer }
    /* Review widget styles */
    .card { background:#fff; padding:16px; border-radius:10px; box-shadow:0 6px 18px rgba(16,24,40,0.06); max-width:720px; margin-top:20px }
    .btn { background:#2563eb; color:#fff; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; font-weight:600 }
    .stars { display:inline-flex; gap:8px; font-size:28px; cursor:pointer; user-select:none; margin-top:8px }
    .star { color:#cbd5e1; transition:color .12s ease, transform .06s ease; }
    .star.active { color:#f59e0b; transform:scale(1.06); }
    .small { font-size:14px; color:#374151 }
    textarea { width:100%; min-height:72px; margin-top:8px; padding:8px; border-radius:8px; border:1px solid #e6e9ef; resize:vertical; font-family:inherit }
    .muted { color:#6b7280; font-size:13px }
    .hidden { display:none }
    .result { margin-top:12px; padding:10px; border-radius:8px; background:#f1f5f9 }
    .downloads { margin-top:18px }
    .downloads a { display:inline-block; margin-bottom:8px }
  </style>
</head>
<body>
  <header>
    <h1>Downloading fun games!!!</h1>
  </header>
  <nav>These games are only meant to be played on a computer</nav>

  <div class="special">
    Here is where you need to go to download turbowarp to play any of these games:<br>
  </div>

  <a href="https://desktop.turbowarp.org/" target="_blank" rel="noopener">Turbowarp download</a>

  <div class="downloads">
    <br><br>
    <a href="Flapping bird.sb3" download><button type="button">Download the flapping bird game here</button></a>
    <br><br>
    <a href="Platformer1.sb3" download><button type="button">Download the platformer game here</button></a>
    <br><br>
    <a href="platformer2.sb3" download><button type="button">Download the second platformer game here</button></a>
    <br><br>
    <a href="Flying_parrot.sb3" download><button type="button">Download the flying parrot game here</button></a>
    <br><br>
    <a href="Ping-Pong(2player).sb3" download><button type="button">Download the 2 player ping-pong game here</button></a>
  </div>

  <!-- Review widget -->
  <div class="card" id="reviewWidget">
    <button class="btn" id="openBtn">rate the games out of 5 stars and leave a comment if you want by clicking here</button>

    <div id="formWrap" class="hidden" style="margin-top:12px">
      <div class="small muted">Tap a star to rate (1–5)</div>
      <div class="stars" id="stars" aria-label="Star rating" role="radiogroup"></div>

      <textarea id="comment" placeholder="Optional comment..."></textarea>

      <div style="margin-top:10px; display:flex; gap:8px">
        <button class="btn" id="submitBtn">Submit</button>
        <button id="cancelBtn" style="background:#e5e7eb; color:#111; border:none; padding:10px 12px; border-radius:8px; cursor:pointer">Cancel</button>
      </div>

      <div id="result" class="result hidden" aria-live="polite"></div>
    </div>

    <div id="savedWrap" style="margin-top:12px"></div>
  </div>

  <script>
    // Elements
    const openBtn = document.getElementById('openBtn');
    const formWrap = document.getElementById('formWrap');
    const starsEl = document.getElementById('stars');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const commentEl = document.getElementById('comment');
    const resultEl = document.getElementById('result');
    const savedWrap = document.getElementById('savedWrap');

    // State
    let current = 0;
    let hover = 0;

    // Build 5 stars
    for (let i = 1; i <= 5; i++) {
      const span = document.createElement('span');
      span.className = 'star';
      span.dataset.value = i;
      span.innerHTML = '★';
      span.setAttribute('role','radio');
      span.setAttribute('aria-checked','false');
      span.setAttribute('tabindex', i === 1 ? '0' : '-1');
      starsEl.appendChild(span);
    }

    function renderStars() {
      const nodes = starsEl.querySelectorAll('.star');
      nodes.forEach(s => {
        const v = Number(s.dataset.value);
        const active = hover ? v <= hover : v <= current;
        s.classList.toggle('active', active);
        s.setAttribute('aria-checked', String(v === current));
      });
    }

    // Mouse interactions
    starsEl.addEventListener('mouseover', e => {
      const s = e.target.closest('.star');
      if (!s) return;
      hover = Number(s.dataset.value);
      renderStars();
    });
    starsEl.addEventListener('mouseout', () => {
      hover = 0;
      renderStars();
    });
    starsEl.addEventListener('click', e => {
      const s = e.target.closest('.star');
      if (!s) return;
      current = Number(s.dataset.value);
      renderStars();
    });

    // Keyboard support
    starsEl.addEventListener('keydown', e => {
      const focused = document.activeElement;
      if (!focused.classList.contains('star')) return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
        const next = Math.min(5, Number(focused.dataset.value) + 1);
        starsEl.querySelector(`.star[data-value="${next}"]`).focus();
        e.preventDefault();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
        const prev = Math.max(1, Number(focused.dataset.value) - 1);
        starsEl.querySelector(`.star[data-value="${prev}"]`).focus();
        e.preventDefault();
      } else if (e.key === 'Enter' || e.key === ' ') {
        current = Number(focused.dataset.value);
        renderStars();
        e.preventDefault();
      }
    });

    // Button interactions
    openBtn.addEventListener('click', () => {
      formWrap.classList.toggle('hidden');
      resultEl.classList.add('hidden');
      commentEl.value = '';
      current = 0;
      renderStars();
    });

    cancelBtn.addEventListener('click', () => {
      formWrap.classList.add('hidden');
    });

    submitBtn.addEventListener('click', () => {
      if (current < 1) {
        resultEl.textContent = 'Please choose 1–5 stars before submitting.';
        resultEl.classList.remove('hidden');
        resultEl.style.color = '#b91c1c';
        return;
      }
      const review = { rating: current, comment: commentEl.value.trim(), ts: new Date().toISOString() };
      const key = 'dance_reviews_v1';
      const existing = JSON.parse(localStorage.getItem(key) || '[]');
      existing.push(review);
      localStorage.setItem(key, JSON.stringify(existing));

      resultEl.style.color = '#064e3b';
      resultEl.innerHTML = `<strong>Thanks!</strong> You rated <strong>${current} / 5</strong>.`;
      if (review.comment) resultEl.innerHTML += `<div style="margin-top:6px">${escapeHtml(review.comment)}</div>`;
      resultEl.classList.remove('hidden');

      formWrap.classList.add('hidden');
      updateSavedSummary();
    });

    function updateSavedSummary() {
      const key = 'dance_reviews_v1';
      const all = JSON.parse(localStorage.getItem(key) || '[]');
      if (all.length === 0) {
        savedWrap.innerHTML = '';
        return;
      }
      const avg = (all.reduce((s,r)=>s+r.rating,0) / all.length).toFixed(2);
      let html = `<div class="small muted">Saved reviews: ${all.length} — average ${avg} / 5</div>`;
      html += '<ul style="margin:8px 0 0 16px">';
      all.slice(-5).reverse().forEach(r => {
        html += `<li style="margin-bottom:6px"><strong>${r.rating}/5</strong>${r.comment ? ' — ' + escapeHtml(r.comment) : ''}</li>`;
      });
      html += '</ul>';
      savedWrap.innerHTML = html;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // Initialize
    renderStars();
    updateSavedSummary();
  </script>
</body>
</html>
